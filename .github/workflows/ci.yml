name: CI

on:
  push:
    branches: [main]
    paths:
      - 'vote/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/vote

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: vote/Dockerfile
          failure-threshold: error

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} \
            -t $IMAGE:${{ github.sha }} ./vote

      - name: Trivy scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD/.trivyignore:/.trivyignore" \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 --ignorefile /.trivyignore \
            $IMAGE:${{ github.sha }}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push $IMAGE:${{ github.sha }}

  update-gitops:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gitops repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/devops-demo-gitops
          token: ${{ secrets.GITOPS_PAT }}

      - name: Update image in values.yaml
        run: |
          sed -i 's|^    repository:.*|    repository: ghcr.io/${{ github.repository_owner }}/vote|' charts/vote/values.yaml
          sed -i 's|^    tag:.*|    tag: "${{ github.sha }}"|' charts/vote/values.yaml
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add charts/vote/values.yaml
          git diff --cached --quiet || git commit -m "vote: update image to ${{ github.sha }}"
          git push
